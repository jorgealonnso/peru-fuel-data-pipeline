name: Tests

on:
  push:
    paths:
      - "*.py"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
      - ".github/workflows/update_geodata.yml"
  pull_request:
    paths:
      - "*.py"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/update_geodata.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
