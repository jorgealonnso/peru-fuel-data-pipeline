name: Smoke test fuel update
# One-time idempotency validation

on:
  push:
    paths:
      - ".github/workflows/smoke_update.yml"

permissions:
  contents: write

jobs:
  smoke-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental update
        env:
          FUEL_LATEST_URL: ${{ vars.FUEL_LATEST_URL }}
        run: python main.py --mode update

      - name: Commit data changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/estado_actual.csv data/history/)" ]]; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git config user.name "fuel-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado_actual.csv data/history/

          if git diff --cached --quiet; then
            echo "No hay cambios staged para guardar."
            exit 0
          fi

          git commit -m "data: first GitHub incremental update"
          git push
