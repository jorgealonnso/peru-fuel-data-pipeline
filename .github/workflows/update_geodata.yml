name: Update establishment geodata

on:
  workflow_dispatch:
  schedule:
    # 08:30 Lima on the fifth day of each month.
    - cron: "30 13 5 * *"

permissions:
  contents: write

concurrency:
  group: fuel-data-pipeline
  cancel-in-progress: false

jobs:
  update-geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update establishment geodata
        run: python geodata.py

      - name: Commit geodata changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/bi/)" ]]; then
            echo "No hay cambios de geodatos para guardar."
            exit 0
          fi

          git config user.name "fuel-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bi/

          if git diff --cached --quiet; then
            echo "No hay cambios staged para guardar."
            exit 0
          fi

          git commit -m "data: update establishment geodata"
          git push
